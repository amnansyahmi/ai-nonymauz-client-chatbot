<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="mm-icon-title">
  <title id="mm-icon-title">MajlisMate</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A840"/>
      <stop offset="45%" stop-color="#C49030"/>
      <stop offset="100%" stop-color="#9E7020"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="112" fill="#241c18"/>

  <!-- Scale the logo mark to fill the icon (original 100×108 → ~370×400 centred) -->
  <g transform="translate(71, 56) scale(3.70)">
    <!-- Outer heart -->
    <path d="M50 98 C20 78, 2 56, 2 33 C2 16, 14 5, 28 5 C38 5, 46 11, 50 19 C54 11, 62 5, 72 5 C86 5, 98 16, 98 33 C98 56, 80 78, 50 98Z"
      fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Left head -->
    <circle cx="29" cy="24" r="8" fill="url(#g)"/>
    <!-- Right head -->
    <circle cx="71" cy="24" r="8" fill="url(#g)"/>
    <!-- Inner M arch -->
    <path d="M29 32 Q29 56, 50 64 Q71 56, 71 32"
      fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left leg -->
    <path d="M29 32 L29 94" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
    <!-- Right leg -->
    <path d="M71 32 L71 94" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
